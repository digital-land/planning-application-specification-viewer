name: Render static specification site

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published specification prerelease tag to reproduce (leave blank for latest)'
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: render-static-site
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viewer
    env:
      BASE_URL: /planning-application-specification-viewer
    steps:
      - name: Check out viewer
        uses: actions/checkout@v6
        with:
          ref: main
          path: viewer

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select published specification prerelease
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/select_spec_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/spec-release.json" --github-env "$GITHUB_ENV"

      - name: Restore project content history
        uses: actions/cache/restore@v4
        with:
          path: viewer/project-content
          key: project-content-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            project-content-

      - name: Install dependencies and selected package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/dev-requirements.txt
          .venv/bin/python -m pip install --no-deps "git+https://github.com/digital-land/planning-application-data-specification.git@$SPEC_RELEASE_RESOLVED_REVISION"
          .venv/bin/python -m pip install --no-deps -e .
          .venv/bin/python -m pip check
          .venv/bin/python -c 'from importlib.metadata import version; import os; assert version("planning-application-specification") == os.environ["SPEC_RELEASE_VERSION"]'

      - name: Fetch project documents and reporting data
        run: |
          .venv/bin/python -m spec_viewer.project_content --ref main --cache project-content
          .venv/bin/python - "$GITHUB_ENV" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          revision = json.loads(Path("project-content/metadata.json").read_text())["resolved_revision"]
          with Path(sys.argv[1]).open("a", encoding="utf-8") as stream:
              stream.write(f"PROJECT_CONTENT_REVISION={revision}\n")
          PYTHON

      - name: Save project content history
        uses: actions/cache/save@v4
        with:
          path: viewer/project-content
          key: project-content-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test and check the specification API
        run: |
          make tests PYTHON=.venv/bin/python
          make smoke-test PYTHON=.venv/bin/python

      - name: Build into a fresh directory
        run: |
          output_dir=$(mktemp -d "$RUNNER_TEMP/viewer-site.XXXXXX")
          .venv/bin/python -m spec_viewer.build --project-root project-content --output "$output_dir" --base-url "$BASE_URL"
          test -s "$output_dir/index.html"
          test -s "$output_dir/submissions/progress/index.html"
          .venv/bin/python - "$output_dir/build-provenance.json" <<'PYTHON'
          import json
          import os
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          project = json.loads(Path("project-content/metadata.json").read_text())
          data = {
              "specification": {
                  "repository": "digital-land/planning-application-data-specification",
                  "version": os.environ["SPEC_RELEASE_VERSION"],
                  "tag": os.environ["SPEC_RELEASE_TAG"],
                  "revision": os.environ["SPEC_RELEASE_RESOLVED_REVISION"],
              },
              "project_content": {
                  "repository": project["repository"],
                  "requested_ref": project["requested_ref"],
                  "revision": project["resolved_revision"],
              },
          }
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PYTHON
          mkdir -p docs
          rsync -a --delete "$output_dir/" docs/

      - name: Commit generated changes only
        run: |
          git add --all -- docs
          if git diff --cached --quiet -- docs; then
            echo "Generated site is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render static site [skip ci]" -m "Specification release: $SPEC_RELEASE_TAG ($SPEC_RELEASE_RESOLVED_REVISION)" -m "Project content: main ($PROJECT_CONTENT_REVISION)"
          git push origin HEAD:main
